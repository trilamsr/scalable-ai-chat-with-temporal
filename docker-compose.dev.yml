version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: chat-redis-dev
    ports:
      - "6379:6379"
    networks:
      - chat-network
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data-dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile.dev
    container_name: chat-backend-dev
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=development
      - PORT=4000
      - FRONTEND_URL=http://localhost:3000
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=debug
    volumes:
      # Mount root package.json for workspace configuration
      - ./package.json:/app/package.json:delegated
      # Mount source code for hot-reloading
      - ./backend/src:/app/backend/src:delegated
      - ./backend/package.json:/app/backend/package.json:delegated
      - ./backend/tsconfig.json:/app/backend/tsconfig.json:delegated
      # Mount shared folder
      - ./shared/src:/app/shared/src:delegated
      - ./shared/package.json:/app/shared/package.json:delegated
      - ./shared/tsconfig.json:/app/shared/tsconfig.json:delegated
      # Keep node_modules in container (don't overwrite with host)
      - /app/node_modules
      - /app/backend/node_modules
      - /app/shared/node_modules
    networks:
      - chat-network
    depends_on:
      - redis
    working_dir: /app/backend
    command: npm run dev

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile.dev
    container_name: chat-frontend-dev
    ports:
      - "3000:3000"
    environment:
      - VITE_BACKEND_URL=http://localhost:4000
    volumes:
      # Mount root package.json for workspace configuration
      - ./package.json:/app/package.json:delegated
      # Mount source code for hot-reloading
      - ./frontend/src:/app/frontend/src:delegated
      - ./frontend/index.html:/app/frontend/index.html:delegated
      - ./frontend/vite.config.ts:/app/frontend/vite.config.ts:delegated
      - ./frontend/package.json:/app/frontend/package.json:delegated
      - ./frontend/tsconfig.json:/app/frontend/tsconfig.json:delegated
      - ./frontend/tailwind.config.js:/app/frontend/tailwind.config.js:delegated
      - ./frontend/postcss.config.js:/app/frontend/postcss.config.js:delegated
      - ./frontend/.env:/app/frontend/.env:delegated
      # Mount shared folder
      - ./shared/src:/app/shared/src:delegated
      - ./shared/package.json:/app/shared/package.json:delegated
      - ./shared/tsconfig.json:/app/shared/tsconfig.json:delegated
      # Keep node_modules in container (don't overwrite with host)
      - /app/node_modules
      - /app/frontend/node_modules
      - /app/shared/node_modules
    networks:
      - chat-network
    depends_on:
      - backend
    working_dir: /app/frontend
    stdin_open: true
    tty: true

networks:
  chat-network:
    driver: bridge

volumes:
  redis-data-dev:
