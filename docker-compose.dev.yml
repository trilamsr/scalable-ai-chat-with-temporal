version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile.dev
    container_name: chat-backend-dev
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=development
      - PORT=4000
      - FRONTEND_URL=http://localhost:3000
      - LOG_LEVEL=debug
    volumes:
      # Mount source code for hot-reloading
      - ./backend/src:/app/backend/src:delegated
      - ./backend/package.json:/app/backend/package.json:delegated
      - ./backend/tsconfig.json:/app/backend/tsconfig.json:delegated
      # Mount shared folder
      - ./shared/src:/app/shared/src:delegated
      - ./shared/package.json:/app/shared/package.json:delegated
      - ./shared/tsconfig.json:/app/shared/tsconfig.json:delegated
      # Keep node_modules in container (don't overwrite with host)
      - /app/backend/node_modules
      - /app/shared/node_modules
    networks:
      - chat-network
    working_dir: /app/backend
    command: npm run dev

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile.dev
    container_name: chat-frontend-dev
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_BACKEND_URL=http://localhost:4000
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    volumes:
      # Mount source code for hot-reloading
      - ./frontend/src:/app/frontend/src:delegated
      - ./frontend/public:/app/frontend/public:delegated
      - ./frontend/package.json:/app/frontend/package.json:delegated
      - ./frontend/tsconfig.json:/app/frontend/tsconfig.json:delegated
      - ./frontend/craco.config.js:/app/frontend/craco.config.js:delegated
      - ./frontend/tailwind.config.js:/app/frontend/tailwind.config.js:delegated
      - ./frontend/postcss.config.js:/app/frontend/postcss.config.js:delegated
      # Mount shared folder
      - ./shared/src:/app/shared/src:delegated
      - ./shared/package.json:/app/shared/package.json:delegated
      - ./shared/tsconfig.json:/app/shared/tsconfig.json:delegated
      # Keep node_modules in container (don't overwrite with host)
      - /app/frontend/node_modules
      - /app/shared/node_modules
    networks:
      - chat-network
    depends_on:
      - backend
    working_dir: /app/frontend
    stdin_open: true
    tty: true

networks:
  chat-network:
    driver: bridge
