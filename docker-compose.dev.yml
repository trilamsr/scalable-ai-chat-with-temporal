services:
  redis:
    image: redis:7-alpine
    container_name: chat-redis-dev
    ports:
      - "6379:6379"
    networks:
      - chat-network
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data-dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  postgres:
    image: postgres:15-alpine
    container_name: chat-postgres-dev
    environment:
      - POSTGRES_USER=temporal
      - POSTGRES_PASSWORD=temporal
      - POSTGRES_DB=temporal
    ports:
      - "5432:5432"
    networks:
      - chat-network
    volumes:
      - postgres-data-dev:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 10s
      timeout: 5s
      retries: 5

  temporal:
    image: temporalio/auto-setup:latest
    container_name: chat-temporal-dev
    ports:
      - "7233:7233"  # gRPC port
      - "8233:8233"  # Web UI port
    environment:
      - DB=postgres12
      - POSTGRES_SEEDS=postgres
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - DB_PORT=5432
      - SKIP_DB_CREATE=false
      - LOG_LEVEL=info
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - chat-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "temporal:7233"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile.dev
    container_name: chat-backend-dev
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=development
      - PORT=4000
      - FRONTEND_URL=http://localhost:3000
      - REDIS_URL=redis://redis:6379
      - TEMPORAL_ADDRESS=temporal:7233
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LOG_LEVEL=debug
    volumes:
      # Mount root package.json for workspace configuration
      - ./package.json:/app/package.json:delegated
      # Mount source code for hot-reloading
      - ./backend/src:/app/backend/src:delegated
      - ./backend/package.json:/app/backend/package.json:delegated
      - ./backend/tsconfig.json:/app/backend/tsconfig.json:delegated
      # Mount shared folder
      - ./shared/src:/app/shared/src:delegated
      - ./shared/package.json:/app/shared/package.json:delegated
      - ./shared/tsconfig.json:/app/shared/tsconfig.json:delegated
      # Keep node_modules in container (don't overwrite with host)
      - /app/node_modules
      - /app/backend/node_modules
      - /app/shared/node_modules
    networks:
      - chat-network
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
    working_dir: /app/backend
    command: npm run dev

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile.dev
    container_name: chat-frontend-dev
    ports:
      - "3000:3000"
    environment:
      - VITE_BACKEND_URL=http://localhost:4000
    volumes:
      # Mount root package.json for workspace configuration
      - ./package.json:/app/package.json:delegated
      # Mount source code for hot-reloading
      - ./frontend/src:/app/frontend/src:delegated
      - ./frontend/index.html:/app/frontend/index.html:delegated
      - ./frontend/vite.config.ts:/app/frontend/vite.config.ts:delegated
      - ./frontend/package.json:/app/frontend/package.json:delegated
      - ./frontend/tsconfig.json:/app/frontend/tsconfig.json:delegated
      - ./frontend/tailwind.config.js:/app/frontend/tailwind.config.js:delegated
      - ./frontend/postcss.config.js:/app/frontend/postcss.config.js:delegated
      - ./frontend/.env:/app/frontend/.env:delegated
      # Mount shared folder
      - ./shared/src:/app/shared/src:delegated
      - ./shared/package.json:/app/shared/package.json:delegated
      - ./shared/tsconfig.json:/app/shared/tsconfig.json:delegated
      # Keep node_modules in container (don't overwrite with host)
      - /app/node_modules
      - /app/frontend/node_modules
      - /app/shared/node_modules
    networks:
      - chat-network
    depends_on:
      - backend
    working_dir: /app/frontend
    stdin_open: true
    tty: true

networks:
  chat-network:
    driver: bridge

volumes:
  redis-data-dev:
  postgres-data-dev:
